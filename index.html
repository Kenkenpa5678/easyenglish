<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>やさしい動詞で伝えよう！ — 英語句動詞600 クイズ＆音読復習</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .blank-pill {
      display: inline-block;
      min-width: 5.5rem;
      border-bottom: 2.5px solid #4f46e5;
      padding: 0 0.45rem;
      margin: 0 0.15rem;
      text-align: center;
      font-weight: 700;
      color: #4f46e5;
      transition: all 0.15s ease;
    }
    .blank-pill.correct {
      border-color: #16a34a;
      color: #15803d;
      background: #dcfce7;
      border-radius: 0.375rem;
    }
    .blank-pill.wrong {
      border-color: #dc2626;
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 0.375rem;
    }
    .phrase-highlight {
      background: linear-gradient(120deg, #e0e7ff 0%, #ede9fe 100%);
      color: #3730a3;
      padding: 0.1rem 0.4rem;
      border-radius: 0.375rem;
      font-weight: 700;
      border-bottom: 2px solid #6366f1;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.35); }
      70% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
    }
    .speaking-active {
      animation: pulse-ring 1.4s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <button id="btn-home" class="flex items-center gap-2 text-left group">
        <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white font-extrabold text-sm flex items-center justify-center shadow-sm group-hover:bg-indigo-700 transition">600</span>
        <div>
          <h1 class="text-sm sm:text-base font-bold text-slate-900 leading-tight">やさしい動詞で伝えよう！</h1>
          <p class="text-[11px] text-slate-500 hidden sm:block leading-none">全600問 単語別・総合ランダム＆音読復習</p>
        </div>
      </button>

      <nav class="flex items-center gap-1.5 sm:gap-2">
        <button id="nav-sets" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition">セット一覧</button>
        <button id="nav-review" class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5">
          <span>音読復習</span>
          <span id="nav-wrong-badge" class="px-1.5 py-0.5 text-[11px] rounded-full bg-rose-100 text-rose-700 font-bold">0</span>
        </button>
        <button id="btn-settings" class="p-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition" title="音声・データ設定" aria-label="設定">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main id="app-main" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6"></main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-medium shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <!-- Settings / Backup Modal -->
  <div id="settings-modal" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-900">音声・学習データ設定</h2>
        <button id="close-settings" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100">✕</button>
      </div>

      <div class="space-y-4 text-sm">
        <div>
          <label for="voice-select" class="block font-semibold text-slate-700 mb-1">英語音声（Web Speech API）</label>
          <select id="voice-select" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
          <p class="text-xs text-slate-500 mt-1">※お使いのブラウザ・OSに搭載された英語音声を使用します。</p>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">デフォルト再生速度</label>
          <div id="speed-options" class="grid grid-cols-4 gap-2"></div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">音読モードのポーズ間隔（リピート間）</label>
          <div id="gap-options" class="grid grid-cols-3 gap-2"></div>
        </div>

        <hr class="border-slate-200" />

        <div class="space-y-2">
          <p class="font-semibold text-slate-700">学習データのバックアップ（GitHub Pages間での移行用）</p>
          <div class="flex gap-2">
            <button id="btn-export" class="flex-1 px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs transition">JSONを書き出す</button>
            <label class="flex-1 px-3 py-2 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-xs text-center cursor-pointer transition">
              JSONを読み込む
              <input id="input-import" type="file" accept="application/json,.json" class="hidden" />
            </label>
          </div>
          <button id="btn-reset-confirm" class="w-full px-3 py-2 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 font-semibold text-xs transition">学習記録をすべてリセット</button>
          <div id="reset-confirm-box" class="hidden p-3 rounded-lg bg-rose-50 border border-rose-200 text-xs space-y-2">
            <p class="text-rose-800 font-semibold">本当にすべての学習記録と復習リストを削除しますか？</p>
            <div class="flex gap-2">
              <button id="btn-reset-exec" class="px-3 py-1.5 rounded bg-rose-600 text-white font-semibold hover:bg-rose-700">削除する</button>
              <button id="btn-reset-cancel" class="px-3 py-1.5 rounded bg-white border border-slate-300 text-slate-700 font-semibold">キャンセル</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Embedded 600 Phrasal Verbs Dataset (60 sets x 10 questions)
    const PHRASAL_SETS = [{"page": 1, "title": "break 1", "choices": ["away", "down", "even", "free from", "in", "into", "out", "the silence", "through", "up"], "questions": [{"n": 1, "jp": "あなたの励ましの言葉で、彼女は自分の殻を破ることができました。", "en": "Your encouraging words helped her break ____ of her shell.", "ans": "out"}, {"n": 2, "jp": "泥棒がわが家に侵入して、私の貴重品をすべて盗んでいってしまいました。", "en": "A thief broke ____ my house and took all my valuables.", "ans": "into"}, {"n": 3, "jp": "私は積年の問題をついに解決しました。", "en": "I have broken ____ my deep-seated problem.", "ans": "through"}, {"n": 4, "jp": "彼女は従来のスタイルから脱却して、自分自身のファッションでいくことにしました。", "en": "She broke ____ from the traditional style to start her own fashion.", "ans": "away"}, {"n": 5, "jp": "この経済危機の中で、私の事業は昨年、収支がかろうじてとんとんに収まりました。", "en": "In this economic crisis, my business just managed to break ____ last year.", "ans": "even"}, {"n": 6, "jp": "誰かがその新入社員に手ほどきをしなければなりません。", "en": "Someone will have to break ____ the new recruit.", "ans": "in"}, {"n": 7, "jp": "イタリアでパスポートをなくしたとき、彼女は取り乱して泣いてしまいました。", "en": "When she lost her passport in Italy, she broke ____ and cried.", "ans": "down"}, {"n": 8, "jp": "あそこでけんかをしている人たちの仲裁に入ってくれませんか？", "en": "Can you break ____ the fight over there?", "ans": "up"}, {"n": 9, "jp": "その会社は、すべての借金から抜け出しました。", "en": "The company broke ____ all the debts.", "ans": "free from"}, {"n": 10, "jp": "お菓子をあげたら、少年は沈黙を破って真実を語りました。", "en": "When I offered some candy, the boy broke ____ and revealed the truth.", "ans": "the silence"}]}, {"page": 2, "title": "break 2", "choices": ["down", "fall", "ground for", "in on [upon]", "it up", "new ground", "off", "out", "out in a cold sweat", "up"], "questions": [{"n": 1, "jp": "6月にわが社は、新しいオフィスビル建設に着手します。", "en": "Our company will break ____ the new office building in June.", "ans": "ground for"}, {"n": 2, "jp": "観客の数を見て、私は怖くなりました。", "en": "I broke ____ having seen all the people in the audience.", "ans": "out in a cold sweat"}, {"n": 3, "jp": "緊急のことなら、ちょっと割って入って知らせてください。", "en": "If it is something urgent, just break ____ me.", "ans": "in on [upon]"}, {"n": 4, "jp": "もう真夜中過ぎだったので、パーティーを解散しました。", "en": "It was already past midnight so we broke ____ the party.", "ans": "up"}, {"n": 5, "jp": "氷の上で滑ったのですが、リュックサックが私を衝撃から守ってくれました。", "en": "I slipped on ice but my backpack broke my ____.", "ans": "fall"}, {"n": 6, "jp": "道化師が転ぶたびに、子どもたちはどっと笑い出しました。", "en": "The children broke ____ in laughter every time the clown fell down.", "ans": "out"}, {"n": 7, "jp": "彼らは、スパイに彼の家族の写真を見せて、自白させました。", "en": "They broke the agent ____ by showing pictures of his family.", "ans": "down"}, {"n": 8, "jp": "この部分がランプから外れ落ちました。", "en": "This part broke ____ from the lamp.", "ans": "off"}, {"n": 9, "jp": "病院の医師たちは、がん研究で新たな発見をしました。", "en": "Doctors at the hospital have broken ____ in cancer research.", "ans": "new ground"}, {"n": 10, "jp": "さあ、君たち2人とも、もう十分です。（けんかを）やめなさい。", "en": "All right, you two. That's enough. Break ____.", "ans": "it up"}]}, {"page": 3, "title": "bring 1", "choices": ["back", "forth", "forward", "into service", "out", "out in droves", "to a standstill", "to my attention", "up", "up to speed"], "questions": [{"n": 1, "jp": "しばらく留守にしていたので、必要な情報を教えてもらえませんか？", "en": "I've been away so could you bring me ____?", "ans": "up to speed"}, {"n": 2, "jp": "古い写真アルバムを見ていたら、すてきな思い出がよみがえりました。", "en": "Looking through old photo albums brought ____ good memories.", "ans": "back"}, {"n": 3, "jp": "私は、新潟の小さな田舎町で育ちました。", "en": "I was brought ____ in a small countryside in Niigata.", "ans": "up"}, {"n": 4, "jp": "首相のその発言は、若干抗議を引き起こしました。", "en": "The Prime Minister's remark has brought ____ some protests.", "ans": "forth"}, {"n": 5, "jp": "この件を私に知らせてくれてありがとう。", "en": "Thank you for bringing this ____.", "ans": "to my attention"}, {"n": 6, "jp": "そのバンドは、盛大な拍手でステージに迎えられました。", "en": "The band was brought ____ on stage by a big applause.", "ans": "out"}, {"n": 7, "jp": "お子さんを前に出してください。診察しますから。", "en": "Bring your child ____ so I can see her.", "ans": "forward"}, {"n": 8, "jp": "新しく開店したそのレストランは、大勢の客を呼び寄せました。", "en": "The newly opened restaurant brought people ____.", "ans": "out in droves"}, {"n": 9, "jp": "費用対効果の優れた新しい機械を使い始めます。", "en": "The new cost effective machinery will be brought ____.", "ans": "into service"}, {"n": 10, "jp": "株式恐慌は仕事を停止させました。", "en": "The stock exchange crisis brought the work ____.", "ans": "to a standstill"}]}, {"page": 4, "title": "bring 2", "choices": ["along", "(a)round", "back to life", "in", "into contact with", "into prominence", "on board", "out the best in", "the house down", "to light"], "questions": [{"n": 1, "jp": "彼は、人工蘇生によって生き返りました。", "en": "With artificial resuscitation, he was brought ____.", "ans": "back to life"}, {"n": 2, "jp": "今の仕事は、私のいちばんよいところを引き出してくれます。", "en": "My current job brings ____ me.", "ans": "out the best in"}, {"n": 3, "jp": "観光事業は、数十億ドルの収益をもたらします。", "en": "Tourism brings ____ billions of dollars in revenue.", "ans": "in"}, {"n": 4, "jp": "新商品を発表したら、わが社は有名になりました。", "en": "Our company was brought ____ when we announced our new product line.", "ans": "into prominence"}, {"n": 5, "jp": "その記事は、彼女の興味深い過去を明らかにしました。", "en": "The article brought ____ an interesting story of her background.", "ans": "to light"}, {"n": 6, "jp": "彼女のすばらしい演奏は、聴衆の大喝采を博しました。", "en": "Her great performance brought ____.", "ans": "the house down"}, {"n": 7, "jp": "新年のパーティーには、夫婦同伴でおいでください。", "en": "Bring your spouses ____ to the New Year's party.", "ans": "along"}, {"n": 8, "jp": "伊勢さんが入社するとすぐに、業績が好転し始めました。", "en": "As soon as we brought Mr. Ise ____, things began to pick up.", "ans": "on board"}, {"n": 9, "jp": "彼女は聞く耳をもたない性格なので、説得することはできませんでした。", "en": "She was so headstrong that I couldn't bring her ____.", "ans": "(a)round"}, {"n": 10, "jp": "トムをビルと会わせると、トラブルが起きる予感がします。", "en": "I foresee trouble if you bring Tom ____ Bill.", "ans": "into contact with"}]}, {"page": 5, "title": "come 1", "choices": ["across", "apart", "full circle", "into being", "into play", "off it", "over", "short of", "up", "up with"], "questions": [{"n"     // ================= QUIZ VIEW =================
    const CONFUSABLE_MAP = {

      'in': ['into', 'on', 'up', 'out', 'at', 'through'],
      'into': ['in', 'to', 'onto', 'through', 'for'],
      'on': ['in', 'at', 'to', 'over', 'up', 'upon'],

      'away': ['off', 'out', 'apart', 'back', 'aside'],

      'to': ['for', 'with', 'at', 'into', 'toward'],

      'back': ['down', 'off', 'away', 'over', 'behind'],
      'around': ['about', 'over', 'along', 'out', 'through'],
      'about': ['around', 'over', 'on', 'for', 'of'],
      'against': ['with', 'for', 'to', 'behind', 'from'],
      'aside': ['away', 'off', 'back', 'apart', 'out'],
      'apart': ['away', 'aside', 'off', 'out'],
      'by': ['with', 'at', 'through', 'on', 'for'],
      'at': ['on', 'in', 'to', 'for', 'with'],
      'after': ['for', 'behind', 'over', 'on'],
      'ahead': ['forward', 'on', 'up', 'along'],
      'forward': ['ahead', 'on', 'forth', 'up'],
      'forth': ['forward', 'out', 'on', 'away'],
      'along': ['around', 'on', 'with', 'over'],
      'together': ['up', 'along', 'in', 'around'],
      'under': ['below', 'down', 'behind', 'off'],
      'behind': ['back', 'after', 'under', 'away'],
      'between': ['among', 'through', 'across', 'with'],
      'beyond': ['over', 'past', 'above', 'through'],
      'past': ['beyond', 'by', 'over', 'through'],
      'still': ['tight', 'quiet', 'back', 'down'],
      'tight': ['still', 'on', 'up', 'back'],
      'short': ['low', 'out', 'down', 'off']
    };

    const ALL_UNIQUE_CHOICES = Array.from(new Set(PHRASAL_SETS.flatMap(set => set.choices)));

    function getSameVerbChoices(q) {
      const baseVerb = q.setTitle.split(' ')[0].toLowerCase();
      const pool = [];
      PHRASAL_SETS.forEach(set => {
        if (set.title.split(' ')[0].toLowerCase() === baseVerb) {
          pool.push(...set.choices);
        }
      });
      return Array.from(new Set(pool));
    }

    function pickTrickyChoices(q) {
      const ansClean = cleanAnswerForSpeech(q.ans).toLowerCase();
      const ansWords = ansClean.split(/\s+/).filter(Boolean);
      const ansWordCount = ansWords.length;
      const ansFirst = ansWords[0] || '';
      const ansLast = ansWords[ansWords.length - 1] || '';
      const hasComma = q.ans.includes(',');

      const sameSet = new Set(q.choices);
      const sameVerb = new Set(getSameVerbChoices(q));
      const confusableSet = new Set(CONFUSABLE_MAP[ansFirst] || CONFUSABLE_MAP[ansLast] || []);

      // Candidate pool: same verb sets + confusable single/multi words + all unique choices
      const candidates = new Set([...sameVerb, ...(CONFUSABLE_MAP[ansFirst] || []), ...ALL_UNIQUE_CHOICES]);
      const scored = [];

      candidates.forEach(cand => {
        const candClean = cleanAnswerForSpeech(cand).toLowerCase();
        if (!candClean || candClean === ansClean || normalizeForCheck(cand) === normalizeForCheck(q.ans)) return;
        const candHasComma = cand.includes(',');
        if (hasComma !== candHasComma) return;

        const candWords = candClean.split(/\s+/).filter(Boolean);
        let score = 0;

        // Word count match is crucial so distractors look grammatically plausible
        if (candWords.length === ansWordCount) score += 50;
        else if (Math.abs(candWords.length - ansWordCount) === 1) score += 10;
        else score -= 30;

        // Same verb set = high semantic/collocation trap
        if (sameSet.has(cand)) score += 35;
        else if (sameVerb.has(cand)) score += 22;

        // Confusable preposition/particle pair
        if (confusableSet.has(candClean) || confusableSet.has(candWords[0]) || confusableSet.has(candWords[candWords.length - 1])) {
          score += 40;
        }

        // Shared prefix/suffix word (e.g. "up with" vs "up to", "care of" vs "charge of")
        if (candWords[0] === ansFirst || candWords[candWords.length - 1] === ansLast) {
          score += 35;
        }
        if (ansClean.length >= 3 && candClean.length >= 3 && candClean[0] === ansFirst[0] && candWords.length === ansWordCount) {
          score += 8;
        }

        // Small random jitter to vary distractors across sessions
        score += Math.random() * 6;
        scored.push({ cand, score });
      });

      scored.sort((a, b) => b.score - a.score);
      const distractors = scored.slice(0, 3).map(x => x.cand);
      return shuffleArray([q.ans, ...distractors]);
    }

    function buildChoicesMap(qids) {
      const map = {};
      qids.forEach(qid => {
        const q = QUESTION_MAP[qid];
        if (q) map[qid] = pickTrickyChoices(q);
      });
      return map;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

              ` : `
                <form id="type-form" class="pt-2 flex flex-col sm:flex-row gap-2">

                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>

              <div class="flex justify-end pt-1">
                <button id="btn-next-q" class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm transition">

          </div>

      `;

      document.getElementById('btn-back-home')?.addEventListener('click', () => {
        stopSpeech();
        ui.view = 'home';
        render();
      });

      document.querySelectorAll('.mode-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.settings.inputMode = b.dataset.mode;
          saveState();
          render();
        });
      });

      document.getElementById('btn-toggle-flag')?.addEventListener('click', () => {
        if ((state.wrong[qid] || 0) > 0) {
          delete state.wrong[qid];
          showToast('復習リストから外しました');
        } else {
          state.wrong[qid] = 1;
          showToast('復習リストに追加しました');
        }
        saveState();
        render();
      });

      const submitAnswer = (chosen, isCorrect) => {
        ui.quizAnswers[qid] = { chosen, isCorrect };
        if (isCorrect) {
          state.mastered[qid] = true;
        } else {
          state.wrong[qid] = (state.wrong[qid] || 0) + 1;
          delete state.mastered[qid];
        }
        saveState();
        render();
        speakText(formatSentence(q.en, q.ans, 'plain'));
      };

      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const chosen = btn.dataset.choice;
          const isCorrect = normalizeForCheck(chosen) === normalizeForCheck(q.ans);
          submitAnswer(chosen, isCorrect);
        });
      });

      const typeForm = document.getElementById('type-form');
      if (typeForm) {
        const inp = document.getElementById('type-input');
        inp?.focus();
        typeForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const val = inp.value.trim();
          if (!val) return;
          const isCorrect = checkTypedAnswer(val, q.ans);
          submitAnswer(val, isCorrect);
        });
      }

      document.getElementById('btn-speak-main')?.addEventListener('click', () => {
        speakText(formatSentence(q.en, q.ans, 'plain'));
      });

      document.getElementById('btn-next-q')?.addEventListener('click', () => {
        stopSpeech();
        if (ui.quizIndex < ui.quizQids.length - 1) {
          ui.quizIndex++;
          render();
        } else {
          if (ui.quizMode === 'set') {
            const set = PHRASAL_SETS[ui.quizSetIdx];
            const correctCount = Object.values(ui.quizAnswers).filter(a => a.isCorrect).length;
            const prev = state.setScores[set.page] || { best: 0, last: 0, attempts: 0 };
            state.setScores[set.page] = {
              best: Math.max(prev.best, correctCount),
              last: correctCount,
              attempts: prev.attempts + 1
            };
            saveState();
          }
          ui.view = 'summary';
          render();
        }
      });
    }

    // ================= SUMMARY VIEW =================

        ui.view = 'home';
        render();

      document.querySelectorAll('[data-play-qid]').forEach(btn => {

    // ================= REVIEW / READ-ALOUD VIEW =================
    function startReview(qids, title) {
      stopSpeech();
      ui.view = 'review';
      ui.reviewQueue = [...qids];
      ui.reviewIndex = 0;
      ui.reviewTitle = title || '間違えた問題の音読復習';
      ui.reviewLoopCurrent = 0;
      render();
    }

    function playReviewLoopStep() {
      if (!ui.isAutoPlaying || ui.reviewQueue.length === 0) return;
      const qid = ui.reviewQueue[ui.reviewIndex];
      const item = QUESTION_MAP[qid];
      if (!item) return;
      const text = formatSentence(item.en, item.ans, 'plain');
      speakText(text, () => {
        if (!ui.isAutoPlaying) return;
        ui.reviewLoopCurrent++;
        state.readCounts[qid] = (state.readCounts[qid] || 0) + 1;
        saveState();
        const countEl = document.getElementById('read-count-val');
        if (countEl) countEl.textContent = state.readCounts[qid];

        const gapMs = (state.settings.gapSec || 3) * 1000;
        const target = ui.reviewLoopTarget;
        if (target === 0 || ui.reviewLoopCurrent < target) {
          ui.autoTimer = setTimeout(playReviewLoopStep, gapMs);
        } else {
          if (ui.reviewIndex < ui.reviewQueue.length - 1) {
            ui.autoTimer = setTimeout(() => {
              if (!ui.isAutoPlaying) return;
              ui.reviewIndex++;
              ui.reviewLoopCurrent = 0;
              render();
              playReviewLoopStep();
            }, gapMs);
          } else {
            ui.isAutoPlaying = false;
            render();
            showToast('音読ループが1周完了しました！');
          }
        }
      });
    }

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>

              次の問題 →

      document.getElementById('btn-rev-home')?.addEventListener('click', () => {

      document.getElementById('btn-toggle-jp')?.addEventListener('click', () => {

      document.getElementById('btn-speak-main')?.addEventListener('click', () => {

        speakText(formatSentence(item.en, item.ans, 'plain'));
      });

      document.getElementById('btn-auto-loop')?.addEventListener('click', () => {
        if (ui.isAutoPlaying) {

          render();

          ui.reviewLoopCurrent = 0;
          render();

      });

      document.querySelectorAll('.rate-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.settings.rate = Number(b.dataset.rate);
          saveState();

          render();

        state.readCounts[qid] = (state.readCounts[qid] || 0) + 1;
        saveState();
        const el = document.getElementById('read-count-val');
        if (el) el.textContent = state.readCounts[qid];
      });

      document.getElementById('btn-mark-mastered')?.addEventListener('click', () => {

          render();
        }
      });

    // ================= HEADER & SETTINGS MODAL =================
    document.getElementById('btn-home').addEventListener('click', () => {
      stopSpeech();
      ui.view = 'home';
      render();
    });
    document.getElementById('nav-sets').addEventListener('click', () => {
      stopSpeech();
      ui.view = 'home';
      render();
    });

      startReview(getWrongQids(), '間違えた問題の音読復習');
    });

    const modal = document.getElementById('settings-modal');
    function openSettings() {
      populateVoiceSelect();

      speedBox.innerHTML = [0.7, 0.85, 1.0, 1.2].map(r => `
        <button data-set-rate="${r}" class="py-2 rounded-lg text-xs font-bold border transition ${state.settings.rate === r ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}">${r}x</button>
      `).join('');
      speedBox.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          state.settings.rate = Number(b.dataset.setRate);
          saveState();
          openSettings();
        });
      });

      const gapBox = document.getElementById('gap-options');
      gapBox.innerHTML = [2, 3, 5].map(g => `
        <button data-set-gap="${g}" class="py-2 rounded-lg text-xs font-bold border transition ${state.settings.gapSec === g ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}">${g}秒</button>
      `).join('');
      gapBox.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          state.settings.gapSec = Number(b.dataset.setGap);
          saveState();
          openSettings();
        });
      });

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    document.getElementById('btn-settings').addEventListener('click', openSettings);
    document.getElementById('close-settings').addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      render();
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        render();
      }
    });
    document.getElementById('voice-select').addEventListener('change', (e) => {
      state.settings.voiceURI = e.target.value;
      saveState();
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'phrasal-verbs-600-backup.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('バックアップを書き出しました');
    });

    document.getElementById('input-import').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && typeof parsed === 'object') {
            state = {
              mastered: parsed.mastered || {},
              wrong: parsed.wrong || {},
              readCounts: parsed.readCounts || {},
              setScores: parsed.setScores || {},
              settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) }
            };
            saveState();
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            render();
            showToast('バックアップを読み込みました');
          }
        } catch (err) {
          showToast('JSONの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
    });

    document.getElementById('btn-reset-confirm').addEventListener('click', () => {
      document.getElementById('reset-confirm-box').classList.remove('hidden');
    });
    document.getElementById('btn-reset-cancel').addEventListener('click', () => {
      document.getElementById('reset-confirm-box').classList.add('hidden');
    });
    document.getElementById('btn-reset-exec').addEventListener('click', () => {
      state = structuredClone(DEFAULT_STATE);
      saveState();
      document.getElementById('reset-confirm-box').classList.add('hidden');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      ui.view = 'home';
      render();
      showToast('学習記録をリセットしました');
    });

    // Initial render
    render();
  </script>
</body>
</html>
